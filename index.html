<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="옵션계약">
<meta name="robots" content="noindex, nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>유상옵션 통합계약</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 상단 단계바 + 본문 1열(태블릿 가로에선 본문+합계 사이드). 밝은 단일 테마(현장 조명·종이 계약서와 같은 톤) */
:root{
  color-scheme:light;
  --bg:#f7f8fb; --surface:#ffffff; --ink:#1d2433; --muted:#667085; --line:#dfe3ea;
  --navy:#2b4c8c; --navy-soft:#eaf0fb; --accent:#b7791f; --accent-soft:#fdf4e3;
  --ok:#2e7d4f; --ok-soft:#e8f5ec; --warn:#b4541e; --warn-soft:#fdeee4;
  --paper:#ffffff; --paper-ink:#111; --paper-line:#444;
  --f-display:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.brand h1{font-size:20px;font-weight:700;color:var(--navy)}
.brand .site{color:var(--muted);font-size:13px}
#userBox{display:flex;align-items:center;gap:8px;font-size:13px;margin-left:auto}
#userBox .me{color:var(--navy)}
#userBox + .tabs{margin-left:0}
.login{max-width:520px;margin:18px auto 0}
.big-seg{padding:10px 16px;font-size:15px}
button,a,input,select,label,textarea{touch-action:manipulation}
.pad,.pad button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.noTag{display:inline-block;background:var(--navy);color:#fff;border-radius:6px;padding:1px 7px;font-weight:700;margin-right:6px;font-family:var(--f-num);font-size:.95em}
.bigno{font-family:var(--f-num);font-size:64px;font-weight:800;color:var(--navy);line-height:1;margin:10px 0}
.pin{display:flex;gap:10px;margin:4px 0 10px}
.pin span{width:16px;height:16px;border-radius:50%;border:2px solid var(--navy)}
.pin span.on{background:var(--navy)}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:300px}
.pad button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:14px 0;font-size:20px;font-family:var(--f-num)}
.pad button:active{background:var(--navy-soft)}
.sample{font-size:12px;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:4px;font-weight:600}
.tabs{display:flex;gap:6px;margin-left:auto}
.tab{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:6px;font-size:13px}
.tab[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.steps{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
.step{flex:1 0 auto;min-width:92px;font-size:13px;padding:7px 10px;border-radius:6px;background:var(--surface);border:1px solid var(--line);color:var(--muted);text-align:left}
.step b{font-family:var(--f-num);margin-right:6px}
.step.on{border-color:var(--navy);color:var(--navy);font-weight:700;box-shadow:inset 0 -3px 0 var(--navy)}
.step.done{color:var(--ok)}

.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;margin-top:18px}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.panel h2{font-size:18px;margin-bottom:4px}
.who{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px;margin-bottom:10px}
.who.staff{background:var(--navy-soft);color:var(--navy)}
.who.cust{background:var(--accent-soft);color:var(--accent)}
.hint{color:var(--muted);font-size:13px;margin:4px 0 14px}
.row{display:flex;flex-wrap:wrap;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 180px;min-width:0}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:11px 12px;font-size:16px;min-width:0}
.big select{font-size:20px;padding:14px}
.typebox{display:flex;align-items:center;gap:12px;margin-top:16px;padding:14px 16px;border-radius:8px;background:var(--navy-soft)}
.typebox .t{font-family:var(--f-display);font-size:26px;font-weight:700;color:var(--navy)}
.alert{margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:14px}
.info{margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--navy-soft);color:var(--navy);font-size:14px}

.cat{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.cat:first-of-type{border-top:0;margin-top:0;padding-top:0}
.cat-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-bottom:8px}
.cat-h h3{font-size:16px}
.cat-h .co{font-size:12px;color:var(--muted)}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-top:6px;background:#fff}
.opt.sel{border-color:var(--navy);background:var(--navy-soft)}
.opt input[type=checkbox]{width:22px;height:22px;accent-color:var(--navy)}
.opt .lbl{font-weight:500}
.opt .desc{grid-column:2/4;font-size:12px;color:var(--muted)}
.opt .price{text-align:right;font-weight:500}
/* v7.1.1: 좁은 화면·큰 글씨에서 옵션명과 금액이 겹치지 않게 */
.opt .lbl{min-width:0;overflow-wrap:anywhere;word-break:keep-all}
@media (max-width:520px){.opt .price{grid-column:2/4;text-align:left}}

.pay{grid-column:2/4;display:flex;gap:6px;flex-wrap:wrap}
.seg{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 10px;font-size:13px}
.seg[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.already{font-size:12px;color:var(--warn);font-weight:600}

.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 140px);align-self:start}
.sum-line{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:5px 0;border-bottom:1px dashed var(--line)}
.sum-line span:first-child{min-width:0}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px}
.total .v{font-size:22px;font-weight:700;color:var(--navy)}
.nav{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;border:0;border-radius:8px;padding:14px;font-weight:700;font-size:16px;background:var(--navy);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);flex:0 0 auto;padding-inline:18px}
.btn.sub{background:var(--navy-soft);color:var(--navy)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.empty{color:var(--muted);font-size:14px}

/* 주소 검색 */
.addr-row{display:flex;gap:8px;align-items:end}
.addr-row .field{flex:1}
.addr-btn{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:8px;padding:11px 16px;font-weight:600;white-space:nowrap}
.addr-box{margin-top:8px;border:1px solid var(--navy);border-radius:10px;padding:12px;background:#fff}
.addr-res{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 4px}
.addr-res small{display:block;color:var(--muted)}
.addr-picked{margin-top:6px;padding:10px 12px;border-radius:8px;background:var(--navy-soft)}

/* 결제 카드 */
.paycard{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:12px;background:#fff}
.paycard.ok{border-color:var(--ok);background:var(--ok-soft)}
.paycard.wait{border-color:var(--accent);background:var(--accent-soft)}
.paycard h3{font-size:16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.paycard table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.paycard td{padding:4px 0;border-bottom:1px dashed var(--line)}
.paycard td:last-child{text-align:right}
.due-now{font-weight:700;color:var(--navy)}
.methods{display:flex;gap:8px;margin-top:12px}
.methods .seg{padding:10px 18px;font-size:15px;font-weight:600}
.howto{margin-top:10px;font-size:14px;display:flex;flex-direction:column;gap:8px}
.depositor{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px dashed var(--accent);border-radius:8px;background:#fff}
.depositor .nm{font-family:var(--f-num);font-size:20px;font-weight:700;letter-spacing:.02em}
.msg{white-space:pre-wrap;font-size:13px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;user-select:all}
.photo{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.photo label.cam{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}
.photo input{position:absolute;opacity:0;width:1px;height:1px}
.thumb{width:72px;height:96px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.status{font-size:13px;font-weight:700}
.status.ok{color:var(--ok)} .status.wait{color:var(--accent)}
.consent{display:flex;gap:10px;align-items:flex-start;margin-top:16px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff}
.consent input{width:22px;height:22px;flex:0 0 auto;accent-color:var(--navy)}

/* 출력 단계 */
.flow{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.flow-step{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff}
.flow-step.done{border-color:var(--ok);background:var(--ok-soft)}
.flow-step .n{width:28px;height:28px;border-radius:50%;background:var(--navy-soft);color:var(--navy);display:grid;place-items:center;font-weight:700;font-family:var(--f-num)}
.flow-step.done .n{background:var(--ok);color:#fff}
.flow-step small{display:block;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:20}

/* 설정 */
.stage-row{display:grid;grid-template-columns:minmax(0,1.3fr) 90px minmax(0,1.3fr) 40px;gap:8px;align-items:end;margin-top:8px}
@media (max-width:520px){.stage-row{grid-template-columns:minmax(0,1fr) 80px 40px}.stage-row .f-due{grid-column:1/3}}
.stage-row input{border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px;min-width:0;width:100%}
.x{border:1px solid var(--line);background:#fff;border-radius:8px;height:42px}
.sumchk{margin-top:10px;font-weight:700}
.sumchk.bad{color:var(--warn)} .sumchk.good{color:var(--ok)}
.ex-table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.ex-table td,.ex-table th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.tblwrap{overflow-x:auto}
.ledger{width:100%;border-collapse:collapse;font-size:13px;min-width:1180px}
.ledger td{white-space:nowrap}
.ledger th{background:var(--navy-soft);color:var(--navy);text-align:left;padding:8px;font-weight:600}
.ledger td{padding:8px;border-bottom:1px solid var(--line);background:#fff}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600}
.pill.c{background:var(--ok-soft);color:var(--ok)} .pill.x{background:var(--warn-soft);color:var(--warn)} .pill.w{background:var(--accent-soft);color:var(--accent)}

/* 계약 현황 */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:2px;background:#fff}
.kpi span{font-size:13px;color:var(--muted)}
.kpi b{font-size:28px;color:var(--navy);line-height:1.2}
.kpi b small{font-size:14px;color:var(--muted);font-weight:500}
.kpi em{font-style:normal;font-size:13px;color:var(--muted)}
.kpi.warn{border-color:var(--accent);background:var(--accent-soft)} .kpi.warn b{color:var(--accent)}
.stat{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
.stat th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.stat td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.stat .r{text-align:right}
.stat .opts{font-size:12px;color:var(--muted)}
.bar{display:inline-block;width:110px;height:8px;border-radius:4px;background:var(--navy-soft);margin-right:8px;vertical-align:middle;overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy);border-radius:4px}
.types{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:8px}
@media (max-width:620px){.types{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tcell{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;background:#fff}
.tcell b{font-size:22px;color:var(--navy)} .tcell b small{font-size:13px;color:var(--muted);font-weight:500}
.tcell .bar{width:100%}
/* A4 용지 미리보기 (v7.3: 한 장 맞춤 · 흑백으로 뽑아도 또렷하게) */
.papers{overflow:hidden;padding-bottom:10px}
.pwrap{margin:14px auto 22px}
.pbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin:0 2px 6px}
.pbar b{color:var(--ink)}
.paper{width:210mm;padding:8mm;background:var(--paper);color:var(--paper-ink);margin:0 auto;box-shadow:0 1px 6px rgba(30,40,60,.12);outline:1px solid var(--line)}
.paper.over{outline:3px solid var(--warn)}
.paper-in{width:194mm;font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:9.5pt;line-height:1.38;--tf:8pt;position:relative}
.paper.co .paper-in{font-size:10.5pt;--tf:9.5pt}
.paper.sum .paper-in{font-size:9pt}
.paper.sum table{margin-top:1.2mm}
.paper.sum .items td{padding:.8mm 1.6mm;line-height:1.25}
.paper.sum .pp .now b{font-size:1.75em}
.paper.sum .sec{margin-top:2.2mm}
/* 품목이 많아 넘칠 때만 쓰는 촘촘한 배치 */
.paper.tight .items td{padding:.45mm 1.4mm;line-height:1.18}
.paper.tight td.hand{height:9.5mm}
.paper.tight .sec{margin-top:1.5mm}
.paper.tight .pp{margin-top:1.2mm}
.paper.tight .pp>div{padding:.8mm 2.5mm}
.paper.tight .small,.paper.tight .hand-note{font-size:7.6pt;line-height:1.28}
@media screen{.paper-in{min-height:272mm}}
.paper h2{font-size:17pt;text-align:center;letter-spacing:.18em;margin:1mm 0 .5mm;color:var(--paper-ink)}
.paper .p-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:8pt}
.paper .copy-tag{border:1px solid var(--paper-ink);padding:0 6px;font-size:8.5pt;font-weight:700;white-space:nowrap}
.paper .p-site{text-align:center;font-size:9pt;margin-bottom:1.5mm}
.paper table{width:100%;border-collapse:collapse;margin-top:1.5mm;font-size:inherit}
.paper th,.paper td{border:1px solid var(--paper-line);padding:1.1mm 1.8mm;vertical-align:middle}
.paper th{background:#eef0f3;font-weight:600;white-space:nowrap;text-align:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.paper th small,.paper td small{display:block;font-size:.8em;font-weight:400;color:#333}
.paper .sec{font-weight:700;margin-top:3mm;font-size:1.05em}
.paper .sec::before{content:"■ "}
.paper .sec small{font-weight:400;font-size:.8em}
.paper .r{text-align:right;white-space:nowrap}
.paper .c{text-align:center}
.paper .num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.paper .ph{color:#999}
/* 고객이 직접 적는 칸: 색 + 굵은 테두리 (흑백 인쇄에서는 옅은 회색) */
.paper .cf{background:#FFE55C !important;outline:2.2px solid #111;outline-offset:-2.2px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.paper .cf-in{padding:0 6px;border-radius:2px;white-space:nowrap}
.paper td.hand{height:11mm}
.paper .hand-note{font-size:8pt;margin:1mm 0 0}
/* 실제 결제 금액: 굵은 테두리 + 큰 글씨 (색 없이도 눈에 띄게) */
.paper td.paynow{font-weight:800;font-size:1.08em;outline:2.2px solid #111;outline-offset:-2.2px}
.paper tr.tot td{font-weight:700;border-top:2px solid #111}
.paper .pp{display:flex;gap:2mm;margin-top:2mm;align-items:stretch}
.paper .pp>div{flex:1;border:1px solid var(--paper-line);padding:1.5mm 2.5mm}
.paper .pp span{display:block;font-size:.9em}
.paper .pp b{display:block;font-size:1.35em;font-family:var(--f-num);text-align:right}
.paper .pp .now{flex:1.6;border:3px solid #111}
.paper .pp .now span{font-weight:700;font-size:1.05em}
.paper .pp .now b{font-size:2em;font-weight:800;line-height:1.15}
.paper.co .paper-in{display:flex;flex-direction:column}
.paper .rcpt-area{flex:1 1 auto;min-height:14mm;margin-top:4mm;border:1px dashed #777;color:#555;font-size:.8em;padding:1.5mm 2.5mm}
.paper .terms{font-size:var(--tf);line-height:1.34;columns:2;column-gap:5mm;margin-top:1mm}
.paper .terms p{margin:0 0 .7mm}
.paper .small{font-size:.84em;margin:1mm 0 0}
.paper .sign{display:flex;justify-content:flex-end;align-items:flex-end;gap:6mm;margin-top:4mm;font-size:1.05em}
.paper .sign .cf{display:inline-block;min-width:44mm;height:12mm;line-height:12mm;text-align:right;padding:0 2mm;font-size:.75em}
.paper .stamp-slot{position:relative;padding-right:16mm}
.paper .stamp{position:absolute;right:0;top:50%;transform:translateY(-50%);height:15mm;opacity:.9;mix-blend-mode:multiply;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cat.think-cat{border:2px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin-top:12px}
.cat-memo{font-size:13px;color:#7a4b00;background:#fff;border:1px dashed var(--accent);border-radius:6px;padding:6px 10px;margin:-2px 0 6px}
.opt.think-opt{border:1.5px dashed var(--accent)}
.note{margin-top:10px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.opt,.paycard,.step,.flow-step{transition:background-color .15s,border-color .15s}}

let API=lsGet("oc_api")||DEFAULT_API;
function syncRecs(){const o=[];
  VISITS.forEach(v=>o.push(["visits",v.id,v]));LEDGER.forEach(r=>o.push(["ledger",r.id,r]));HIST.forEach(h=>o.push(["hist",h.id,h]));

  lsSet("oc_pending",JSON.stringify(SYNC.pending));}
async function syncPush(){if(!API||SYNC.busy)return;const keys=Object.keys(SYNC.pending);if(!keys.length)return;SYNC.busy=true;
  try{const rows=keys.map(k=>SYNC.pending[k]);const sent={};keys.forEach(k=>{sent[k]=JSON.stringify(SYNC.pending[k].data);});const r=await fetchT(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({rows})},20000).then(x=>x.json());
    /* v6.5: 보내는 사이에 더 새로 바뀐 기록은 지우지 않고 다음에 다시 보낸다 */
    if(r.ok){const ackT=Date.now();keys.forEach(k=>{if(SYNC.pending[k]&&JSON.stringify(SYNC.pending[k].data)===sent[k]){delete SYNC.pending[k];SYNC.ack[k]=ackT;}});lsSet("oc_pending",JSON.stringify(SYNC.pending));SYNC.ok=true;SYNC.at=Date.now();SYNC.err="";}
  }catch(e){SYNC.ok=false;SYNC.err="연결 끊김";}finally{SYNC.busy=false;syncBadge();if(SYNC.ok&&Object.keys(SYNC.pending).length)setTimeout(syncPush,100);}}
function syncApply(c,id,d){
  if(c==="visits"){const i=VISITS.findIndex(x=>x.id===id);if(i>=0)VISITS[i]=d;else VISITS.push(d);}
  else if(c==="ledger"){const i=LEDGER.findIndex(x=>x.id===id);if(i>=0)LEDGER[i]=d;else LEDGER.push(d);}
  else if(c==="hist"){const i=HIST.findIndex(x=>x.id===id);if(i>=0)HIST[i]=d;else HIST.push(d);}
  else if(c==="meta"){if(d.k==="ORIG")ORIG[d.u]=d.v;if(d.k==="OWNER")OWNER[d.u]=d.v;if(d.k==="JOB")JOBS[d.u]=d.v;if(d.k==="STN")STN[d.u]=d.v;}}
/* v6.7: 응답 없이 멈춘 요청은 정해진 시간 뒤 끊는다 (멈춘 요청 하나가 이후 동기화를 막지 않게) */
function fetchT(url,opt,ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);return fetch(url,Object.assign({},opt||{},{signal:c.signal})).finally(()=>clearTimeout(t));}
function syncPull(){if(!API||st.guestOnly)return Promise.resolve();if(SYNC.pullP)return SYNC.pullP;
  SYNC.pullP=syncPullOnce().finally(()=>{SYNC.pullP=null;});return SYNC.pullP;}
/* v6.5: 버튼을 누르기 전에 출발한 가져오기 결과가 방금 바꾼 기록을 옛 값으로 덮지 않게 한다 */
async function syncPullOnce(){const t0=Date.now();let skipped=false;
  try{const r=await fetchT(API+(API.includes("?")?"&":"?")+"since="+Math.max(0,SYNC.last-30000),{},10000).then(x=>x.json());if(!r.ok)throw 0;
    if(r.resetAt&&r.resetAt>SYNC.resetAt){if(SYNC.loaded){VISITS.length=0;LEDGER.length=0;HIST.length=0;Object.keys(ORIG).forEach(k=>delete ORIG[k]);Object.keys(OWNER).forEach(k=>delete OWNER[k]);[JOBS,STN,STN_T,JOB_T].forEach(o=>Object.keys(o).forEach(k=>delete o[k]));SYNC.hash={};SYNC.pending={};SYNC.ack={};SYNC.dirtyRender=true;}SYNC.resetAt=r.resetAt;}
    let changed=false;if(r.now)SRV_OFF=r.now-Date.now();
    r.rows.forEach(x=>{const k=x.col+"|"+x.id,j=JSON.stringify(x.data);
      if(x.col==="meta"&&x.data){if(x.data.k==="STN")STN_T[x.data.u]=x.t;if(x.data.k==="JOB")JOB_T[x.data.u]=x.t;}
      if(SYNC.pending[k]){skipped=true;return;}if(SYNC.ack[k]!=null){if(t0<=SYNC.ack[k]){skipped=true;return;}if(t0-SYNC.ack[k]>60000)delete SYNC.ack[k];}if(SYNC.hash[k]===j)return;SYNC.hash[k]=j;syncApply(x.col,x.id,x.data);if(!(x.col==="meta"&&x.data&&x.data.k==="STN"))changed=true;});
    if(!skipped)SYNC.last=r.now;SYNC.loaded=true;SYNC.ok=true;SYNC.at=Date.now();SYNC.err="";
    if(changed||SYNC.dirtyRender)syncRender();
  }catch(e){SYNC.ok=false;SYNC.err="연결 끊김";}syncBadge();}

/* v7.4.5 아이폰 사파리: 입력하는 순간 화면이 크게 튀면 입력 직전 위치로 되돌린다 */
(function(){let y=null,t=0;

const jobSnap=()=>JSON.parse(JSON.stringify({amend:st.amend,reprint:st.reprint,ptest:st.ptest,forceType:st.forceType,cdate:st.cdate,dong:st.dong,ho:st.ho,sel:st.sel,cust:st.cust,consent1:st.consent1,consent2:st.consent2,paid:st.paid,visitId:st.visitId,t0:st.t0}));
/* 출력 요청 보내기. solo = 한 장만 뽑을 때 그 장의 순서(0부터), 전체면 null */
function sendJob(solo,to,force){
  solo=solo==null?null:solo;const last=myJobs()[0];
  /* 같은 버튼을 연달아 눌러 두 번 나오는 것을 막는다 */
  if(!force&&last&&last.solo===solo&&last.to===to&&(last.s==="req"||last.s==="got")&&Date.now()-last.at<4000){toast("이미 보냈습니다. 잠시만 기다려 주세요.");return null;}
  myJobs().forEach(j=>{if(j.s==="req")j.s="cancel";});
  const id=uid("J");
  JOBS[id]={id,at:Date.now(),dev:DEV,desk:st.desk,by:st.user,to,s:"req",solo,n:solo==null?printDocs().length:1,unit:unitKey(),key:jobKey(),p:jobSnap()};
  return JOBS[id];
}
/* 계약을 마쳤거나 화면을 떠났으면, 이 기기가 보낸 요청에서 계약자 정보를 지운다 (아직 안 나간 요청은 취소) */
function jobSweep(){
  if(st.role==="출력")return;const key=st.user&&unitKey()?jobKey():null;
  Object.values(JOBS).forEach(j=>{if(j.dev!==DEV||j.key===key)return;if(j.s==="req")j.s="cancel";if(j.p&&j.s!=="got")j.p=null;});
}
function routeHtml(){
  if(!API)return"";
  if(!Object.keys(STN).length&&PTO!=="A"&&PTO!=="B")return""; /* 출력 PC를 한 번도 켠 적 없는 현장은 예전 화면 그대로 */
  const r=printRoute();const cur=r.to||"here";
  const b=(k,l)=>`<button type="button" class="seg" data-pto="${k}" aria-pressed="${cur===k}">${l}${k!=="here"?`<i class="dot ${stnAlive(k)?"on":""}"></i>`:""}</button>`;
  return`<div class="proute"><span>출력 보낼 곳</span>${b("A","프린터 A")}${b("B","프린터 B")}${b("here","이 태블릿에서 직접")}
   ${r.to||PTO==="here"?"":`<small>켜져 있는 출력 PC가 없어 이 태블릿에서 직접 인쇄합니다.</small>`}</div>`;
}
/* 같은 프린터에 바로 앞서 넘어간 계약서가 아직 찍히는 중인지 어림한다.
 * PC가 프린터로 넘긴 시각(같은 PC의 시계끼리 비교)과 장수로 계산한다. 한 장에 걸리는 시간은 어림값이다 */
const PAGE_MS=6000, JOBSEEN={};
function jobWait(j){
  if(!j.doneAt)return{ms:0,who:[],pages:0};let free=0;const act=[];let res={ms:0,who:[],pages:0};
  Object.values(JOBS).filter(x=>x.to===j.to&&x.s==="done"&&x.doneAt&&x.doneAt<=j.doneAt&&j.doneAt-x.doneAt<600000).sort((a,b)=>a.doneAt-b.doneAt||(a.id===j.id?1:-1)).forEach(x=>{
    if(x.id===j.id){const ah=act.filter(a=>a.end>j.doneAt);res={ms:Math.max(0,free-j.doneAt),who:[...new Set(ah.map(a=>a.by))],pages:ah.reduce((t,a)=>t+a.n,0)};return;}
    const n=x.solo==null?(x.n||1):1;const start=Math.max(x.doneAt,free);free=start+n*PAGE_MS;act.push({by:x.by,n,end:free});});
  return res;
}
function jobLineHtml(){
  const j=myJobs()[0];if(!j||j.s==="cancel")return"";
  const age=Math.round((Date.now()-j.at)/1000);const P="프린터 "+j.to;const o=stnOther(j.to);
  const alt=`<div class="row" style="gap:6px;margin-top:8px">${stnAlive(o)?`<button type="button" class="seg" data-resend="${o}">프린터 ${o}로 다시 보내기</button>`:""}<button type="button" class="seg" id="printHere">이 태블릿에서 직접 인쇄</button></div>`;
  const what=j.solo==null?j.n+"장":"1장";
  if(j.s==="req")return age<20?`<div class="jobline wait"><b>${P}로 보냈습니다 (${what})</b> · 받는 중… ${age}초</div>`
    :`<div class="jobline bad"><b>${P} 옆 출력 PC가 ${age}초째 받지 않습니다.</b> PC가 켜져 있는지 확인하거나 아래 버튼으로 뽑으세요.${alt}</div>`;
  if(j.s==="got")return age<75?`<div class="jobline wait"><b>${P}에서 인쇄 중입니다 (${what})</b> · ${age}초</div>`
    :`<div class="jobline bad"><b>${P}가 인쇄 중 표시에서 멈췄습니다.</b> 종이가 나왔는지 보고, 안 나왔으면 아래 버튼으로 뽑으세요.${alt}</div>`;
  if(j.s==="done"){const w=jobWait(j);if(!JOBSEEN[j.id])JOBSEEN[j.id]=Date.now();
    if(w.pages&&w.ms-(Date.now()-JOBSEEN[j.id])>0)return`<div class="jobline wait"><b>${P}로 넘겼습니다 (${what})</b> · 앞에 보낸 ${esc(w.who.join(", "))} 계약서 ${w.pages}장이 먼저 나옵니다.<small>이어서 바로 나오니 다시 누르지 말고 기다려 주세요.</small></div>`;}
  if(j.s==="done")return`<div class="jobline ok"><b>${P}에서 출력했습니다 (${what})</b> · ${hhmm(j.at)}<small>종이가 안 나왔으면 프린터 용지·걸림을 확인한 뒤 [다시 인쇄]를 누르세요.</small></div>`;
  return`<div class="jobline bad"><b>${P}에서 출력하지 못했습니다.</b>${j.err?" ("+esc(j.err)+")":""}${alt}</div>`;
}
function bindJobLine(){
  $$("[data-resend]").forEach(b=>b.onclick=()=>{const j=myJobs()[0];if(!j)return;if(sendJob(j.solo,b.dataset.resend,true)){render();toast(`프린터 ${b.dataset.resend}로 다시 보냈습니다.`);}});
  const ph=$("#printHere");if(ph)ph.onclick=()=>{const j=myJobs()[0];if(j&&j.s==="req")j.s="cancel";afterRender();doPrint(j?j.solo:null);};
}
function bindRoute(){
  $$("[data-pto]").forEach(b=>b.onclick=()=>{PTO=b.dataset.pto;lsSet("oc_pto",PTO==="here"?"":PTO);render();});
  bindJobLine();
}
/* 출력 단계에 있는 동안: 상태 줄을 1초마다 고치고, 출력 PC가 켜지거나 꺼지면 화면을 다시 그린다 */
setInterval(()=>{
  if(!st.user||st.view!=="contract"||st.step!==3||st.custView)return;
  const el=$("#jobLine");if(el){const h=jobLineHtml();if(el.dataset.h!==h){el.dataset.h=h;el.innerHTML=h;bindJobLine();}}
  const sig=(stnAlive("A")?"A":"")+(stnAlive("B")?"B":"");if(sig!==STNSIG){STNSIG=sig;syncRender();}
},1000);

/* ----- 출력 담당 PC ----- */
const STNRUN={on:false,busy:false,seen:{},cur:null,dup:false,since:0,wake:null,lastMs:null};
function stnHost(){let h=$("#stnPapers");if(!h){h=document.createElement("div");h.id="stnPapers";h.className="papers";document.body.appendChild(h);}return h;}
function stnBeat(){
  if(!isStn()||!API)return;const o=STN[st.stn];
  /* 같은 프린터 담당으로 PC 두 대가 켜지면 같은 계약서가 두 번 나온다. 나중에 켠 쪽이 멈춘다 */
  if(o&&o.dev&&o.dev!==DEV&&STN_T[st.stn]&&srvNow()-STN_T[st.stn]<65000&&(o.since||0)<=STNRUN.since){if(!STNRUN.dup){STNRUN.dup=true;if(st.view==="station")render();}return;}
  STNRUN.dup=false;STN[st.stn]={at:Date.now(),by:st.user,auto:st.stnAuto!==false,dev:DEV,since:STNRUN.since};scanDirty();syncPush();
}
async function stnWake(){
  try{if(navigator.wakeLock&&!document.hidden&&!STNRUN.wake){const w=await navigator.wakeLock.request("screen");STNRUN.wake=w;w.addEventListener("release",()=>{STNRUN.wake=null;if(isStn()&&st.view==="station"&&!STNRUN.busy)render();});}}catch(e){STNRUN.wake=null;}
  if(isStn()&&st.view==="station"&&!STNRUN.busy)render();
}
document.addEventListener("visibilitychange",()=>{if(isStn()&&!document.hidden)stnWake();});
function stnClean(){
  Object.values(JOBS).forEach(j=>{if(j.to!==st.stn||!JOB_T[j.id])return;const age=srvNow()-JOB_T[j.id];
    if(j.p&&["done","fail","cancel"].includes(j.s)&&age>600000)j.p=null;              /* 계약자 정보는 10분 뒤 지운다 */
    if(j.s==="got"&&age>180000&&!(STNRUN.cur&&STNRUN.cur.id===j.id)){j.s="fail";j.err="인쇄 중 멈춤";}});
  scanDirty();syncPush();
}
function stnEnsure(){
  if(STNRUN.on)return;STNRUN.on=true;STNRUN.since=Date.now();document.body.classList.add("stn-mode");stnWake();setTimeout(stnWarm,600);
  let n=0,started=false;
  const tick=()=>{if(!isStn())return;n++;stnTick();
    if(n%4===0&&API)syncPull().then(()=>{syncPush();stnTick();});
    if(n%40===2)stnBeat();
    if(n%120===0)stnClean();};
  const plain=()=>{if(!started){started=true;setInterval(tick,500);}};
  /* 창이 가려져도 느려지지 않게 별도 타이머(워커)로 돌린다. 안 되면 보통 타이머로 */
  try{const w=new Worker(URL.createObjectURL(new Blob(["setInterval(()=>postMessage(0),500)"],{type:"text/javascript"})));w.onmessage=()=>{started=true;tick();};w.onerror=plain;setTimeout(()=>{if(!started)plain();},2500);}catch(e){plain();}
}
function stnTick(){
  if(!isStn()||st.view!=="station"||STNRUN.busy||STNRUN.dup||st.stnAuto===false)return;
  const j=Object.values(JOBS).filter(x=>x.s==="req"&&x.to===st.stn&&x.p&&!STNRUN.seen[x.id]).sort((a,b)=>(JOB_T[a.id]||a.at)-(JOB_T[b.id]||b.at))[0];
  if(!j)return;
  /* PC를 늦게 켰을 때 한참 전 요청이 쏟아져 나오지 않게, 3분 넘은 요청은 뽑지 않는다 */
  if(JOB_T[j.id]&&srvNow()-JOB_T[j.id]>180000){STNRUN.seen[j.id]=1;j.s="fail";j.err="3분 넘게 받지 못함";j.p=null;scanDirty();syncPush();return;}
  stnPrint(j,false);
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
/* 요청 내용으로 계약서를 그린다. 양식은 st(계약석 상태)를 보고 그려지므로, 잠깐 요청 내용으로 바꿔 그린 뒤 바로 되돌린다 */
function stnDraw(j){
  const keep={};Object.keys(blank()).forEach(k=>keep[k]=st[k]);const ku=st.user,kd=st.desk;let docs=[];
  try{Object.assign(st,blank(),JSON.parse(JSON.stringify(j.p)),{user:j.by,desk:j.desk});docs=printDocs();}
  finally{Object.assign(st,keep,{user:ku,desk:kd});}
  const host=stnHost();
  host.innerHTML=docs.map((d,i)=>`<div class="pwrap ${j.solo===i?"on":""}">${d.h}</div>`).join("");
  const mark=`${j.by} · ${hhmm(Date.now())}`;
  host.querySelectorAll(".p-top").forEach(e=>{const m=document.createElement("span");m.className="jobmark";m.textContent=mark;e.insertBefore(m,e.children[1]||null);});
  void host.offsetHeight;return docs;
}
/* 처음 켰을 때 한 번 미리 그려서 글꼴을 받아 둔다 (첫 계약서가 늦게 나오거나 글자 폭이 달라지지 않게) */
async function stnWarm(){
  if(STNRUN.busy)return;STNRUN.busy=true;
  try{stnDraw(stnTestJob(null));if(document.fonts&&document.fonts.ready)await Promise.race([document.fonts.ready,sleep(4000)]);}catch(e){}
  finally{const h=$("#stnPapers");if(h)h.innerHTML="";STNRUN.busy=false;}
}
async function stnPrint(j,manual){
  if(STNRUN.busy||!j||!j.p)return;
  STNRUN.busy=true;STNRUN.seen[j.id]=1;STNRUN.cur=j;
  try{
    if(!manual){j.s="got";j.stn=st.stn;scanDirty();syncPush();}
    if(st.view==="station")render();
    const docs=stnDraw(j);
    document.body.classList.remove("print-qr");document.body.classList.toggle("solo",j.solo!=null);
    if(document.fonts&&document.fonts.ready)await Promise.race([document.fonts.ready,sleep(1500)]);
    fitPapers();
    await new Promise(r=>{let done=false;const f=()=>{if(!done){done=true;r();}};try{requestAnimationFrame(()=>requestAnimationFrame(f));}catch(e){}setTimeout(f,250);});
    const tp=Date.now();window.print();STNRUN.lastMs=Date.now()-tp;
    /* PC 크롬은 인쇄가 넘어갈 때까지 위 줄에서 멈춘다. 멈추지 않고 바로 돌아왔다면, 화면을 지우기 전에 인쇄할 내용을 가져갈 시간을 준다 */
    if(STNRUN.lastMs<300)await sleep(3000);
    j.s="done";j.doneAt=Date.now();j.n=j.solo==null?docs.length:1;
  }catch(e){j.s="fail";j.err=String((e&&e.message)||e).slice(0,80);}
  finally{const h=$("#stnPapers");if(h)h.innerHTML="";document.body.classList.remove("solo");STNRUN.busy=false;STNRUN.cur=null;
    if(JOBS[j.id]){scanDirty();syncPush();}if(st.view==="station")render();}
}
const stnTestJob=solo=>({id:"T"+Date.now(),at:Date.now(),by:st.user,desk:9,to:st.stn,s:"test",solo,n:solo==null?0:1,unit:"101-1201",
  p:{ptest:true,dong:"101",ho:"1201",forceType:"59A",sel:{FPCA:"split",N06A:"lump",NBA:"split",GBA:"split",CTA:"split"},cust:{name:"홍길동",phone:"010-1234-5678",birth:"800312",addr:"인천광역시 미추홀구 숭의로 10",addrDetail:"5층",zip:"22175",cash:""},consent2:true}});
/* 출력 PC는 인쇄 창을 건너뛰므로 크롬의 '머리글과 바닥글'(날짜·주소·쪽수)을 끌 기회가 없다.

function bindStation(){

let postcodeState=window.daum&&window.daum.Postcode?"ok":"";
function loadPostcode(cb){if(postcodeState==="ok"){cb();return;}if(postcodeState==="fail"){cb();return;}
  if(postcodeState!=="loading"){postcodeState="loading";const sc=document.createElement("script");sc.src=POSTCODE_JS;
    sc.onload=()=>{postcodeState=window.daum&&window.daum.Postcode?"ok":"fail";(loadPostcode.q||[]).forEach(f=>f());loadPostcode.q=[];};
    sc.onerror=()=>{postcodeState="fail";(loadPostcode.q||[]).forEach(f=>f());loadPostcode.q=[];};document.head.appendChild(sc);
    setTimeout(()=>{if(postcodeState==="loading"){postcodeState="fail";(loadPostcode.q||[]).forEach(f=>f());loadPostcode.q=[];}},8000);}
  (loadPostcode.q=loadPostcode.q||[]).push(cb);}
function addrBox(){
  if(postcodeState==="fail")return`<div class="addr-box"><p class="note" style="margin:0 0 6px">주소 검색 서비스에 연결되지 않아 샘플 주소로 찾습니다. 인터넷 연결을 확인하세요.</p><input id="addrQ" class="memo" style="border-color:var(--line)" value="${esc(st.addrQ)}" placeholder="도로명, 건물명, 지번 (예: 숭의)"><div id="addrRes">${addrResults()}</div></div>`;
  return`<div class="addr-box"><div class="row" style="justify-content:space-between;align-items:center;margin-bottom:6px"><small style="color:var(--muted)">도로명·건물명·지번으로 검색하고 결과를 누르세요</small><button type="button" class="seg" id="addrClose">닫기</button></div><div id="postcodeWrap" style="height:440px;border:1px solid var(--line);border-radius:8px;overflow:hidden">${postcodeState==="ok"?"":'<p class="note" style="padding:12px">주소 검색을 불러오는 중…</p>'}</div></div>`;}
function bindAddr(target){
  const cl=$("#addrClose");if(cl)cl.onclick=()=>{st.addrOpen=false;render();};
  const pw=$("#postcodeWrap");
  if(pw){if(postcodeState!=="ok"){loadPostcode(()=>{if(st.addrOpen)render();});}
    else{new daum.Postcode({width:"100%",height:"100%",animation:false,
      oncomplete:d=>{target.addr=d.roadAddress||d.jibunAddress||d.address;target.zip=d.zonecode;if(d.buildingName&&target.addr.indexOf(d.buildingName)<0)target.addr+=" ("+d.buildingName+")";st.addrOpen=false;st.addrQ="";render();
        const det=$("#g-addrDetail")||$("[data-cf='addrDetail']");if(det)det.focus();}}).embed(pw,{autoClose:false});}}
  const aq=$("#addrQ");if(aq){const upd=()=>{st.addrQ=aq.value;$("#addrRes").innerHTML=addrResults();bindAddrRes(target);};let comp=false;
    aq.addEventListener("compositionstart",()=>comp=true);aq.addEventListener("compositionend",()=>{comp=false;upd();});aq.addEventListener("input",()=>{if(!comp)upd();});}
  bindAddrRes(target);
}
function bindAddrRes(target){$$("[data-addr]").forEach(b=>b.onclick=()=>{const a=ADDR_SAMPLE[+b.dataset.addr];target.addr=a.road;target.zip=a.zip;st.addrOpen=false;st.addrQ="";render();});}
function bindGuest(phone){
  const g=st.g;
  const rq=$("#rv-q");if(rq)rq.oninput=()=>{st.rvq=rq.value;$("#rv-res").innerHTML=revisitRes(st.rvq);bindRevisit(()=>{st.rvq="";render();});};
  bindRevisit(()=>{st.rvq="";render();});
  $$("[data-rewait]").forEach(b=>b.onclick=()=>{const v=VISITS.find(x=>x.id===b.dataset.rewait);if(v){v.status="방문";delete v.holdAt;toast("상담 대기로 되돌렸습니다. 입장 순서대로 안내됩니다.");render();}});
  const back=$("#g-back");if(back)back.onclick=()=>{st.guestMode=false;st.gdone=false;render();};
  const again=$("#g-again");if(again)again.onclick=()=>{st.gdone=false;render();};
  const pv=$("#g-phone-preview");if(pv)pv.onclick=()=>{st.guestMode=true;st.gdone=false;render();};
  const qp=$("#g-qr-print");if(qp)qp.onclick=()=>{document.body.classList.remove("solo");document.body.classList.add("print-qr");window.print();};
  const u=$("#g-unit");if(u)u.oninput=()=>{g.unit=u.value;const hit=parseUnit(g.unit);const el=$("#g-hit");el.className="unit-hit"+(g.unit&&!hit?" bad":"");el.textContent=hit?`${unitLabel(hit)} · ${UNITS[hit]} 타입`:g.unit?"세대 리스트에 없는 동·호수입니다":"";};
  const un=$("#g-unknown");if(un)un.onchange=()=>{g.unknown=un.checked;render();};
  [["g-name","name"],["g-phone","phone"],["g-addrDetail","addrDetail"],["g-paper","paperNo"]].forEach(([id,k])=>{const el=$("#"+id);if(el)el.oninput=()=>g[k]=el.value;});
  const ao=$("#g-addrOpen");if(ao)ao.onclick=()=>{st.addrOpen=!st.addrOpen;render();const q=$("#addrQ");if(q)q.focus();};
  bindAddr(g);
  $$("[data-gmode]").forEach(b=>b.onclick=()=>{g.mode=b.dataset.gmode;render();});
  const c1=$("#g-c1");if(c1)c1.onchange=()=>g.c1=c1.checked;const c2=$("#g-c2");if(c2)c2.onchange=()=>g.c2=c2.checked;
  const sb=$("#g-submit");if(sb)sb.onclick=()=>{
    const unit=g.unknown?"":parseUnit(g.unit);
    if(!g.unknown&&!unit){toast("동·호수를 확인해 주세요. 모르시면 '모릅니다'에 체크하세요.");return;}
    if(!g.name.trim()||!/^01\d[-\s]?\d{3,4}[-\s]?\d{4}$/.test(g.phone.trim())){toast("이름과 휴대폰 번호를 확인해 주세요.");return;}
    if(!g.c1){toast("필수 동의에 체크해 주세요.");return;}
    const staff=!phone&&g.mode==="staff";
    const rec={id:"G"+Date.now()+Math.random().toString(36).slice(2,5),unit,type:UNITS[unit]||"",name:g.name.trim(),phone:g.phone.trim(),addr:g.addr,zip:g.zip,addrDetail:g.addrDetail,sms:g.c2,
      via:phone?"qr":staff?"staff":"tablet",staffBy:staff?st.user:"",paperNo:staff?g.paperNo:"",at:Date.now(),status:"방문",date:today(),items:{}};
    sb.disabled=true;sb.textContent="등록 중…";
    registerVisit(rec).then(r=>{
      st.g={unit:"",unknown:false,name:"",phone:"",addr:"",zip:"",addrDetail:"",c1:false,c2:false,mode:g.mode,paperNo:""};
      st.gres=r;
      if(phone){st.gdone=true;}else toast(r.dup?`이미 ${r.no}번으로 등록된 세대입니다.`:r.no?`${r.no}번으로 등록했습니다. 번호표에 적어 드리세요.`:"등록했습니다. (번호는 연결되면 붙습니다)");
      render();});};
}

/* v7.1: 등록 = 서버에서 입장번호 발급 (기기끼리 번호가 겹치지 않게 한 곳에서 매김) */
async function registerVisit(rec){
  rec.tok=Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,8);
  if(!API){const mx=VISITS.filter(v=>v.date===rec.date).reduce((m,v)=>Math.max(m,v.no||0),0);
    const dup=rec.unit&&VISITS.find(v=>v.date===rec.date&&v.unit===rec.unit&&v.no);if(dup)return{ok:true,dup:true,no:dup.no,id:dup.id};
    rec.no=mx+1;VISITS.push(rec);return{ok:true,no:rec.no,id:rec.id,tok:rec.tok};}
  try{const r=await fetchT(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({op:"register",row:{col:"visits",id:rec.id,by:st.user||"고객",data:rec}})},15000).then(x=>x.json());
    if(r&&r.ok){if(r.dup)return{ok:true,dup:true,no:r.no,id:r.id};rec.no=r.no;VISITS.push(rec);SYNC.hash["visits|"+rec.id]=JSON.stringify(rec);return{ok:true,no:r.no,id:rec.id,tok:rec.tok};}
  }catch(e){}
  VISITS.push(rec);return{ok:false,id:rec.id};
}
/* ===== 고객 '내 순서' 화면 (?me=…&t=…) ===== */
async function loadMe(){try{const r=await fetchT(API+(API.includes("?")?"&":"?")+"me="+encodeURIComponent(st.meId)+"&t="+encodeURIComponent(st.meTok),{},10000).then(x=>x.json());st.me=r;}catch(e){st.me=st.me||{err:"net"};}render();}
function viewMe(){const m=st.me;
  if(!m)return`<div class="guest-wrap"><div class="phone"><p class="hint">불러오는 중…</p></div></div>`;
  if(!m.ok)return`<div class="guest-wrap"><div class="phone"><h2>${esc(S.siteName)} 옵션 행사</h2><p class="hint">${m.err==="net"?"인터넷 연결을 확인해 주세요. 잠시 후 다시 확인합니다.":"등록 정보를 찾을 수 없습니다. 입구 직원에게 말씀해 주세요."}</p></div></div>`;
  let big="",sub="";
  if(m.desk&&m.status==="계약대기"){big=`${m.desk}번 계약석으로 와 주세요`;sub="계약 실장이 기다리고 있습니다.";}
  else if(m.status==="방문"){big=m.ahead?`상담 대기 · 앞에 ${m.ahead}분`:"곧 상담 실장이 안내해 드립니다";sub="순서가 되면 상담 실장이 찾아갑니다.";}
  else if(m.status==="상담중"){big="상담 중입니다";sub="";}
  else if(m.status==="보류"){big="상담을 잠시 멈췄습니다";sub="돌아오시면 입구 직원이나 상담 실장에게 말씀해 주세요.";}
  else if(m.status==="계약대기"){big=m.ahead?`계약석 대기 · 앞에 ${m.ahead}분`:"곧 계약석에서 부릅니다";sub="번호를 부르면 계약석으로 와 주세요.";}
  else if(m.status==="삼성안내"){big="삼성 계약석으로 가 주세요";sub="삼성 품목은 삼성 직원이 직접 계약합니다.";}
  else if(m.status==="계약"){big="계약이 완료되었습니다";sub="감사합니다.";}
  else{big="방문해 주셔서 감사합니다";sub="궁금한 점은 상담 실장에게 문의해 주세요.";}
  return`<div class="guest-wrap"><div class="phone" style="text-align:center"><div style="color:var(--muted)">${esc(S.siteName)} 옵션 행사</div>
   <div style="margin-top:14px;color:var(--muted)">입장번호</div><div class="bigno">${m.no||"-"}</div>
   <div style="font-size:20px;font-weight:700;margin:10px 0 4px;${m.desk&&m.status==="계약대기"?"color:var(--accent)":""}">${big}</div><p class="hint">${sub}</p>
   <p class="note">이 화면은 자동으로 새로 고쳐집니다. 화면을 닫아도 이 주소로 다시 열 수 있습니다.</p></div></div>`;}
/* ===== 상담 체크리스트 ===== */
function viewConsult(){
  const td=VISITS.filter(v=>v.date===visitDay());
  const mine=td.filter(x=>x.status==="상담중"&&x.consultant===st.user).sort((a,b)=>a.at-b.at);
  const wait=waitList();
  const held=td.filter(x=>x.status==="보류").sort((a,b)=>(a.holdAt||0)-(b.holdAt||0));
  const others=td.filter(x=>x.status==="상담중"&&x.consultant!==st.user).sort((a,b)=>a.at-b.at);
  const waitC=td.filter(x=>x.status==="계약대기"&&!x.calledDesk).sort((a,b)=>a.queueAt-b.queueAt);
  const v=VISITS.find(x=>x.id===st.cv);
  const row=(x,cls,chip,first)=>`<button class="vrow ${x.id===st.cv?"on":""} ${first?"first":""}" data-cv="${x.id}"><b>${noTag(x)}${esc(x.name)}</b><span class="chip ${cls}">${chip}</span><small>${x.unit?unitLabel(x.unit)+" · "+x.type:"동·호 미확정"} · ${hhmm(x.at)} 입장${x.back?" · 계약석에서 돌아옴":""}${x.revisit?" · 재방문":""}</small></button>`;
  return`<div class="two ${v?"open":""}"><section class="panel"><span class="who staff">${esc(st.user)}</span><h2>상담할 세대</h2>
   <p class="hint" style="margin:2px 0 8px">계약석 대기 <b>${queue().length}</b>세대 · 계약석 진행 중 <b>${inDesk().length}</b>세대</p>
   <div class="field" style="margin:6px 0 10px"><input id="cv-q" inputmode="numeric" placeholder="번호 · 동호수 · 휴대폰 뒤 4자리로 찾기 (재방문 포함)" value="${esc(st.cq||"")}" autocomplete="off"><div id="cv-qres">${searchRes(st.cq)}</div></div>
   ${mine.length?`<h3 class="vh">내가 상담 중</h3><div class="vlist">${mine.map(x=>row(x,statusChip(x.status),whoStatus(x))).join("")}</div>`:""}
   <h3 class="vh">상담 대기 · 입장 순서 ${wait.length}세대</h3><p class="hint" style="margin-top:0">먼저 온 순서입니다. 맨 위 고객부터 번호로 부르고 [상담 시작]을 누르세요.</p>
   <div class="vlist">${wait.map((x,i)=>row(x,"think",(i+1)+"번째 · "+waitTxt(x),i===0)).join("")||'<p class="empty">상담을 기다리는 세대가 없습니다.</p>'}</div>
   ${held.length?`<h3 class="vh">보류 · 자리 비움 ${held.length}세대</h3><p class="hint" style="margin-top:0">고객이 돌아오면 눌러서 바로 이어 가세요.</p><div class="vlist">${held.map(x=>row(x,"warn","보류"+(x.consultant?" · "+esc(x.consultant):""))).join("")}</div>`:""}
   ${others.length?`<h3 class="vh">다른 실장 상담 중 (눌러서 이어받기 가능)</h3><div class="vlist">${others.map(x=>row(x,statusChip(x.status),whoStatus(x))).join("")}</div>`:""}
   ${waitC.length?`<h3 class="vh">계약석 대기 · 상담을 마친 순서 ${waitC.length}세대</h3><div class="vlist">${waitC.map(x=>row(x,"think",whoStatus(x))).join("")}</div>`:""}
  </section>
  <section class="panel">${v?`<button class="seg cv-close" id="cv-close">← 목록으로</button>`+consultSheet(v):'<h2>체크리스트</h2><p class="hint">상담 대기 목록에서 맨 위 고객을 누르세요.</p>'}</section></div>`;
}
function searchRes(q){q=(q||"").replace(/\D/g,"");if(!q)return"";const td=visitDay();
  let r=VISITS.filter(v=>(q.length<=3&&String(v.no)===q&&v.date===td)||(q.length===4&&((v.phone||"").replace(/\D/g,"").endsWith(q)||(v.unit&&v.unit.endsWith("-"+String(+q)))))||(q.length>=6&&v.unit===parseUnit(q)));
  r=r.sort((a,b)=>(b.date>a.date?1:b.date<a.date?-1:0)||(b.at-a.at)).slice(0,8);
  if(!r.length)return'<p class="note" style="margin:4px 0">찾는 고객이 없습니다.</p>';
  return`<div class="vlist" style="margin-top:6px">${r.map(x=>`<button class="vrow" data-cv="${x.id}"><b>${noTag(x)}${esc(x.name)}</b><span class="chip ${x.date!==td?"warn":statusChip(x.status)}">${x.date!==td?x.date.slice(5)+" 방문 · 재방문 등록":whoStatus(x)}</span><small>${unitLabel(x.unit)}${x.type?" · "+x.type:""}${x.consultant?" · "+esc(x.consultant):""}</small></button>`).join("")}</div>`;}
function revisitCard(v){const its=Object.values(v.items||{});
  return`<h2>${esc(v.name)} <span class="chip warn">${v.date.slice(5)} 방문</span></h2>
   <div class="kv" style="margin:10px 0"><span>동·호수</span><b>${v.unit?unitLabel(v.unit)+" · "+v.type:"미확정"}</b><span>휴대폰</span><b class="num">${esc(v.phone||"-")}</b><span>그날 결과</span><b>${statusName(v.status)}${v.consultant?" · "+esc(v.consultant):""}</b><span>체크 내용</span><b>선택 ${its.filter(i=>i.state==="sel").length} · 고민 중 ${its.filter(i=>i.state==="think").length}</b></div>
   <p class="hint">이전 방문 기록입니다. [재방문 등록]을 누르면 QR을 다시 찍지 않고 오늘 입장번호를 받으며, 그때 체크한 내용이 그대로 이어집니다.${v.status==="계약"?" 이미 계약한 세대의 추가·변경은 관리자가 관리대장에서 처리합니다.":""}</p>
   <div class="nav"><button class="btn" id="cv-revisit">재방문 등록</button></div>`;}
function startCard(v){const n=waitList().findIndex(x=>x.id===v.id)+1;const its=Object.values(v.items||{});const had=its.filter(i=>i.state==="sel"||i.state==="think").length;
  return`<h2>${noTag(v)}${esc(v.name)} <span class="chip think">${v.status==="미결정"?"미결정 · 다시 상담 가능":v.status==="삼성안내"?"삼성 안내 · 우리 품목 추가 시 다시 상담":v.status==="보류"?"보류 · 돌아오면 이어서 상담":"대기 "+n+"번째 · "+waitTxt(v)}</span></h2>
   <div class="kv" style="margin:10px 0"><span>동·호수</span><b>${v.unit?unitLabel(v.unit)+" · "+v.type:"미확정 (상담 중 확인)"}</b><span>휴대폰</span><b class="num">${esc(v.phone||"-")}</b><span>입장</span><b>${hhmm(v.at)} · ${esc(viaLabel(v))}</b></div>
   ${had?`<div class="info">이전에 체크한 내용이 있습니다 (선택 ${its.filter(i=>i.state==="sel").length} · 고민 중 ${its.filter(i=>i.state==="think").length}). 시작하면 그대로 이어집니다.</div>`:""}
   ${n>1?`<p class="note">앞에 ${n-1}세대가 더 기다리고 있습니다.</p>`:""}
   <div class="nav"><button class="btn" id="cv-start">${had?"상담 이어가기":"상담 시작"}</button></div>
   <p class="note">누르면 다른 태블릿에서 '${esc(st.user)} 상담 중'으로 바뀌어 같은 고객에게 겹쳐 가지 않습니다.</p>`;}
function consultSheet(v){
  if(v.date!==visitDay())return revisitCard(v);
  if(["방문","미결정","보류","삼성안내"].includes(v.status))return startCard(v);
  if(v.status==="상담중"&&v.consultant!==st.user)return`<h2>${noTag(v)}${esc(v.name)}</h2><p class="hint">${esc(v.consultant||"다른 실장")}이(가) 상담 중입니다.</p><div class="nav"><button class="btn" id="cv-take">이어서 상담하기</button></div><p class="note">담당 실장이 자리를 비워야 할 때만 쓰세요. 누르면 담당이 ${esc(st.user)}(으)로 바뀌고, 지금까지 체크한 내용은 그대로 이어집니다.</p>`;

function fitPapers(){
  const wrap=$(".papers");if(!wrap)return;const mm=96/25.4,H=272*mm;let over=0;
  $$(".paper").forEach(p=>{p.style.zoom="";p.style.transform="";p.style.margin="";p.classList.remove("over");const inn=p.querySelector(".paper-in");inn.style.zoom="";inn.style.width="";inn.style.height="";inn.style.minHeight="";inn.style.removeProperty("--tf");
    let f=parseFloat(getComputedStyle(inn).getPropertyValue("--tf"))||8;p.classList.remove("tight");
    const shrink=min=>{while(inn.scrollHeight>H+1&&f>min+.01){f-=.2;inn.style.setProperty("--tf",f.toFixed(1)+"pt");}};
    shrink(7.2);if(inn.scrollHeight>H+1){p.classList.add("tight");shrink(6.6);}
    if(inn.scrollHeight>H+1){const z=Math.max(.82,H/inn.scrollHeight-.01);inn.style.zoom=z.toFixed(3);inn.style.width=(194/z).toFixed(1)+"mm";inn.style.height=(272/z).toFixed(1)+"mm";inn.style.minHeight=(272/z).toFixed(1)+"mm";
      if(inn.scrollHeight>272/z*mm+2){p.classList.add("over");over++;}}});
  const z=Math.min(1,(wrap.clientWidth-4)/(210*mm));$$(".paper").forEach(p=>{if(z<1){const w=p.offsetWidth,h=p.offsetHeight;p.style.transformOrigin="0 0";p.style.transform="scale("+z.toFixed(4)+")";p.style.margin="0 "+(-w*(1-z)).toFixed(1)+"px "+(-h*(1-z)).toFixed(1)+"px 0";}});
  const w=$("#fitWarn");if(w)w.hidden=!over;
}

function saveContract(){

  const u=unitKey();let v=curVisit();const consulted=new Set(v?Object.entries(v.items).filter(([c,it])=>it.state==="sel").map(([c])=>c):[]);const viaDesk=!v;

    amount:lineAmt(x.opt.price,x.cat.id,x.method),method:x.method==="lump"?"일시납":"분할",pay:payLabel(p),payMemo:p.memo||"",status:"계약",staff:st.user,desk:st.desk,

/* 변경 계약 확정: 빠진 품목은 취소, 새 품목은 추가, 납부 방식이 바뀐 품목은 금액을 고친다. 이력과 업체 통보문이 남는다 */
function applyAmend(){
  const u=st.amend.unit,base=st.amend.base,cur=st.sel,v=curVisit();const live=LEDGER.filter(r=>r.unit===u&&r.status!=="취소");
  const rowOf=id=>{const{cat,opt}=findOpt(id);return live.find(r=>r.cat===cat.id&&r.opt===opt.label);};
  const txt=[],cos=new Set();
  Object.keys(base).forEach(id=>{const{cat,opt}=findOpt(id);const r=rowOf(id);if(!r)return;
    if(!(id in cur)){r.status="취소";const d=dueLeft(r);txt.push(`빼기: ${cat.name} · ${opt.label} (${won(r.amount)}원 · ${d>=0?"철회 기한 내":"철회 기한 경과"})`);cos.add(cat.co);}
    else if(cur[id]!==base[id]){const b=`${r.method} ${won(r.amount)}원`;r.method=cur[id]==="lump"?"일시납":"분할";r.amount=lineAmt(opt.price,cat.id,cur[id]);if(payDone(st.paid[cat.co]))r.pay=payLabel(st.paid[cat.co]);txt.push(`납부 변경: ${cat.name} ${b} → ${r.method} ${won(r.amount)}원`);cos.add(cat.co);}});
  Object.keys(cur).forEach(id=>{if(id in base)return;const{cat,opt}=findOpt(id);const p=st.paid[cat.co];
    LEDGER.push({id:uid("L"),no:contractNo(cat.co),unit:u,type:utype(),cat:cat.id,opt:opt.label,item:cat.name+" · "+opt.label,co:cat.co,amount:lineAmt(opt.price,cat.id,cur[id]),method:cur[id]==="lump"?"일시납":"분할",
      pay:payDone(p)?payLabel(p):"정산 필요",payMemo:(p&&p.memo)||"",status:"계약",staff:st.user,desk:st.desk||"-",name:st.cust.name.trim(),date:today(),from:"사후 추가"});
    txt.push(`추가: ${cat.name} · ${opt.label} (${cur[id]==="lump"?"일시납":"분할"} ${won(lineAmt(opt.price,cat.id,cur[id]))}원)`);cos.add(cat.co);});
  if(!txt.length){toast("바뀐 내용이 없습니다.");return;}
  addHist(u,"변경 계약",txt.join("\n"),[...cos]);
  if(v){selToVisit(v);v.contract={...(v.contract||{}),amendAt:Date.now(),by:st.user,ver:((v.contract&&v.contract.ver)||1)+1,cust:{...st.cust}};}
  ORIG[u]=false;Object.assign(st,blank());st.view="ledger";st.lv="unit";st.lunit=u;render();window.scrollTo(0,0);

}

/* ===== 관리대장 (v5): 처리할 일 → 검색 → 세대 카드 → 처리 → 업체 통보 ===== */
const DAY=864e5;
const todayMs=()=>Date.parse(today());
const dueLeft=r=>Math.ceil((Date.parse(r.date)+14*DAY-todayMs())/DAY);
const md=d=>{const x=new Date(d);return`${x.getMonth()+1}/${x.getDate()}`;};
const visitOf=u=>VISITS.filter(v=>v.unit===u).sort((a,b)=>(b.status==="계약")-(a.status==="계약"))[0];
const canEdit=()=>st.role==="관리";

function unitRows(){
  const m={};LEDGER.forEach(r=>{(m[r.unit]=m[r.unit]||[]).push(r);});
  return Object.entries(m).map(([u,rows])=>{const live=rows.filter(r=>r.status!=="취소");const v=visitOf(u);
    const owner=OWNER[u]||{};const cc=(v&&v.contract&&v.contract.cust)||{};
    return{u,type:rows[0].type,rows,live,name:owner.name||(live[0]||rows[0]).name,phone:owner.phone||cc.phone||(v?v.phone:""),total:live.reduce((t,r)=>t+r.amount,0),
      wait:live.some(r=>WAITPAY.includes(r.pay)),orig:ORIG[u]===false,due:live.some(r=>{const d=dueLeft(r);return d>=0&&d<=3;}),un:HIST.some(h=>h.unit===u&&!h.notified)};})
   .sort((a,b)=>unitCode(a.u).localeCompare(unitCode(b.u)));
}
function todo(){const us=unitRows();return{wait:us.filter(x=>x.wait).length,orig:us.filter(x=>x.orig).length,un:HIST.filter(h=>!h.notified).length,due:us.filter(x=>x.due).length};}
function matchQ(x,q){q=q.trim();if(!q)return true;const d=q.replace(/\D/g,"");
  return (d.length>=3&&unitCode(x.u).includes(d))||(d.length>=6&&parseUnit(d)===x.u)||(d.length===4&&String(x.phone).endsWith(d))||x.name.includes(q)||x.rows.some(r=>r.name.includes(q));}
function filtered(){const f=st.lf;return unitRows().filter(x=>matchQ(x,st.lq)&&(!f||(f==="wait"&&x.wait)||(f==="orig"&&x.orig)||(f==="due"&&x.due)||(f==="un"&&x.un)));}

function addHist(unit,kind,text,cos,extra={}){
  const x=unitRows().find(z=>z.u===unit);
  const msg=`[${kind} 통보] ${unitLabel(unit)} ${x?x.name:""}\n${text}${extra.judge?"\n판정: "+extra.judge:""}\n해당 업체: ${cos.map(c=>COMPANIES[c].short).join(", ")}\n처리: ${st.user} (${md(Date.now())} ${hhmm(Date.now())})`;
  HIST.push({id:uid("H"),at:Date.now(),by:st.user,unit,kind,text,judge:extra.judge||"",cos,msg,notified:false});
}
