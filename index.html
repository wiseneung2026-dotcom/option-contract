<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="옵션계약">
<meta name="robots" content="noindex, nofollow">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>유상옵션 통합계약</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 상단 단계바 + 본문 1열(태블릿 가로에선 본문+합계 사이드). 밝은 단일 테마(현장 조명·종이 계약서와 같은 톤) */
:root{
  color-scheme:light;
  --bg:#f7f8fb; --surface:#ffffff; --ink:#1d2433; --muted:#667085; --line:#dfe3ea;
  --navy:#2b4c8c; --navy-soft:#eaf0fb; --accent:#b7791f; --accent-soft:#fdf4e3;
  --ok:#2e7d4f; --ok-soft:#e8f5ec; --warn:#b4541e; --warn-soft:#fdeee4;
  --paper:#ffffff; --paper-ink:#111; --paper-line:#444;
  --f-display:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.brand h1{font-size:20px;font-weight:700;color:var(--navy)}
.brand .site{color:var(--muted);font-size:13px}
#userBox{display:flex;align-items:center;gap:8px;font-size:13px;margin-left:auto}
#userBox .me{color:var(--navy)}
#userBox + .tabs{margin-left:0}
.login{max-width:520px;margin:18px auto 0}
.big-seg{padding:10px 16px;font-size:15px}
.pin{display:flex;gap:10px;margin:4px 0 10px}
.pin span{width:16px;height:16px;border-radius:50%;border:2px solid var(--navy)}
.pin span.on{background:var(--navy)}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:300px}
.pad button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:14px 0;font-size:20px;font-family:var(--f-num)}
.pad button:active{background:var(--navy-soft)}
.sample{font-size:12px;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:4px;font-weight:600}
.tabs{display:flex;gap:6px;margin-left:auto}
.tab{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:6px;font-size:13px}
.tab[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.steps{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
.step{flex:1 0 auto;min-width:92px;font-size:13px;padding:7px 10px;border-radius:6px;background:var(--surface);border:1px solid var(--line);color:var(--muted);text-align:left}
.step b{font-family:var(--f-num);margin-right:6px}
.step.on{border-color:var(--navy);color:var(--navy);font-weight:700;box-shadow:inset 0 -3px 0 var(--navy)}
.step.done{color:var(--ok)}

.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;margin-top:18px}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.panel h2{font-size:18px;margin-bottom:4px}
.who{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px;margin-bottom:10px}
.who.staff{background:var(--navy-soft);color:var(--navy)}
.who.cust{background:var(--accent-soft);color:var(--accent)}
.hint{color:var(--muted);font-size:13px;margin:4px 0 14px}
.row{display:flex;flex-wrap:wrap;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 180px;min-width:0}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:11px 12px;font-size:16px;min-width:0}
.big select{font-size:20px;padding:14px}
.typebox{display:flex;align-items:center;gap:12px;margin-top:16px;padding:14px 16px;border-radius:8px;background:var(--navy-soft)}
.typebox .t{font-family:var(--f-display);font-size:26px;font-weight:700;color:var(--navy)}
.alert{margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:14px}
.info{margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--navy-soft);color:var(--navy);font-size:14px}

.cat{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.cat:first-of-type{border-top:0;margin-top:0;padding-top:0}
.cat-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-bottom:8px}
.cat-h h3{font-size:16px}
.cat-h .co{font-size:12px;color:var(--muted)}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-top:6px;background:#fff}
.opt.sel{border-color:var(--navy);background:var(--navy-soft)}
.opt input[type=checkbox]{width:22px;height:22px;accent-color:var(--navy)}
.opt .lbl{font-weight:500}
.opt .desc{grid-column:2/4;font-size:12px;color:var(--muted)}
.opt .price{text-align:right;font-weight:500}
.pay{grid-column:2/4;display:flex;gap:6px;flex-wrap:wrap}
.seg{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 10px;font-size:13px}
.seg[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.already{font-size:12px;color:var(--warn);font-weight:600}

.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 140px);align-self:start}
.sum-line{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:5px 0;border-bottom:1px dashed var(--line)}
.sum-line span:first-child{min-width:0}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px}
.total .v{font-size:22px;font-weight:700;color:var(--navy)}
.nav{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;border:0;border-radius:8px;padding:14px;font-weight:700;font-size:16px;background:var(--navy);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);flex:0 0 auto;padding-inline:18px}
.btn.sub{background:var(--navy-soft);color:var(--navy)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.empty{color:var(--muted);font-size:14px}

/* 주소 검색 */
.addr-row{display:flex;gap:8px;align-items:end}
.addr-row .field{flex:1}
.addr-btn{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:8px;padding:11px 16px;font-weight:600;white-space:nowrap}
.addr-box{margin-top:8px;border:1px solid var(--navy);border-radius:10px;padding:12px;background:#fff}
.addr-res{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 4px}
.addr-res small{display:block;color:var(--muted)}
.addr-picked{margin-top:6px;padding:10px 12px;border-radius:8px;background:var(--navy-soft)}

/* 결제 카드 */
.paycard{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:12px;background:#fff}
.paycard.ok{border-color:var(--ok);background:var(--ok-soft)}
.paycard.wait{border-color:var(--accent);background:var(--accent-soft)}
.paycard h3{font-size:16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.paycard table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.paycard td{padding:4px 0;border-bottom:1px dashed var(--line)}
.paycard td:last-child{text-align:right}
.due-now{font-weight:700;color:var(--navy)}
.methods{display:flex;gap:8px;margin-top:12px}
.methods .seg{padding:10px 18px;font-size:15px;font-weight:600}
.howto{margin-top:10px;font-size:14px;display:flex;flex-direction:column;gap:8px}
.depositor{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px dashed var(--accent);border-radius:8px;background:#fff}
.depositor .nm{font-family:var(--f-num);font-size:20px;font-weight:700;letter-spacing:.02em}
.msg{white-space:pre-wrap;font-size:13px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;user-select:all}
.photo{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.photo label.cam{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}
.photo input{position:absolute;opacity:0;width:1px;height:1px}
.thumb{width:72px;height:96px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.status{font-size:13px;font-weight:700}
.status.ok{color:var(--ok)} .status.wait{color:var(--accent)}
.consent{display:flex;gap:10px;align-items:flex-start;margin-top:16px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff}
.consent input{width:22px;height:22px;flex:0 0 auto;accent-color:var(--navy)}

/* 출력 단계 */
.flow{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.flow-step{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff}
.flow-step.done{border-color:var(--ok);background:var(--ok-soft)}
.flow-step .n{width:28px;height:28px;border-radius:50%;background:var(--navy-soft);color:var(--navy);display:grid;place-items:center;font-weight:700;font-family:var(--f-num)}
.flow-step.done .n{background:var(--ok);color:#fff}
.flow-step small{display:block;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:20}

/* 설정 */
.stage-row{display:grid;grid-template-columns:minmax(0,1.3fr) 90px minmax(0,1.3fr) 40px;gap:8px;align-items:end;margin-top:8px}
@media (max-width:520px){.stage-row{grid-template-columns:minmax(0,1fr) 80px 40px}.stage-row .f-due{grid-column:1/3}}
.stage-row input{border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px;min-width:0;width:100%}
.x{border:1px solid var(--line);background:#fff;border-radius:8px;height:42px}
.sumchk{margin-top:10px;font-weight:700}
.sumchk.bad{color:var(--warn)} .sumchk.good{color:var(--ok)}
.ex-table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.ex-table td,.ex-table th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.tblwrap{overflow-x:auto}
.ledger{width:100%;border-collapse:collapse;font-size:13px;min-width:1180px}
.ledger td{white-space:nowrap}
.ledger th{background:var(--navy-soft);color:var(--navy);text-align:left;padding:8px;font-weight:600}
.ledger td{padding:8px;border-bottom:1px solid var(--line);background:#fff}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600}
.pill.c{background:var(--ok-soft);color:var(--ok)} .pill.x{background:var(--warn-soft);color:var(--warn)} .pill.w{background:var(--accent-soft);color:var(--accent)}

/* 계약 현황 */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:2px;background:#fff}
.kpi span{font-size:13px;color:var(--muted)}
.kpi b{font-size:28px;color:var(--navy);line-height:1.2}
.kpi b small{font-size:14px;color:var(--muted);font-weight:500}
.kpi em{font-style:normal;font-size:13px;color:var(--muted)}
.kpi.warn{border-color:var(--accent);background:var(--accent-soft)} .kpi.warn b{color:var(--accent)}
.stat{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
.stat th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.stat td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.stat .r{text-align:right}
.stat .opts{font-size:12px;color:var(--muted)}
.bar{display:inline-block;width:110px;height:8px;border-radius:4px;background:var(--navy-soft);margin-right:8px;vertical-align:middle;overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy);border-radius:4px}
.types{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:8px}
@media (max-width:620px){.types{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tcell{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;background:#fff}
.tcell b{font-size:22px;color:var(--navy)} .tcell b small{font-size:13px;color:var(--muted);font-weight:500}
.tcell .bar{width:100%}
/* A4 용지 미리보기 */
.papers{overflow-x:auto;padding-bottom:10px}
.paper{width:794px;min-height:1123px;background:var(--paper);color:var(--paper-ink);margin:16px auto;padding:48px 52px;box-shadow:0 1px 6px rgba(30,40,60,.12);border:1px solid var(--line);font-size:12px;line-height:1.5}
.paper h2{font-size:22px;text-align:center;letter-spacing:.2em;margin-bottom:6px;color:var(--paper-ink)}
.paper .no{text-align:right;font-family:var(--f-num);font-size:11px}
.paper table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}
.paper th,.paper td{border:1px solid var(--paper-line);padding:6px 8px;vertical-align:middle}
.paper th{background:#eef1f6;font-weight:600;white-space:nowrap}
.paper .sec{font-weight:700;margin-top:16px;font-size:13px}
.paper .sign{display:flex;justify-content:flex-end;gap:30px;margin-top:22px;font-size:13px}
.paper .sign span{display:inline-block;min-width:140px;border-bottom:1px solid var(--paper-ink);text-align:right}
.paper .terms{font-size:10.5px;columns:2;column-gap:20px;margin-top:10px}
.paper .r{text-align:right}
.paper .ph{color:#999}
.paper .hand{height:40px;background:#fffdf3}
.paper .hand-note{font-size:10.5px;color:#555}
.copy-tag{display:inline-block;border:1px solid var(--paper-ink);padding:1px 8px;font-size:11px;float:left}
.note{margin-top:10px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.opt,.paycard,.step,.flow-step{transition:background-color .15s,border-color .15s}}
/* v4: 방명록 · 상담 · 대기열 · 추가 계약 안내 */
.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;background:var(--navy-soft);color:var(--navy);white-space:nowrap}
.chip.think{background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.gray{background:#eef0f4;color:var(--muted)}
.two{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;margin-top:18px}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.vlist{display:flex;flex-direction:column;gap:8px}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 12px;width:100%}
.ord{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--navy);color:#fff;font-weight:700;font-size:13px;margin-right:8px}
.vrow .ord{grid-row:1/3}
.vrow:has(.ord){grid-template-columns:auto minmax(0,1fr) auto}
.vrow:has(.ord) small{grid-column:2/4}
.vrow.first{border-color:var(--navy);border-width:2px}
.vh{font-size:14px;margin:14px 0 6px;color:var(--navy)}
.vlist.dim{opacity:.6}
.assign{border:1px solid var(--navy);border-top:0;border-radius:0 0 10px 10px;margin-top:-8px;padding:10px 12px;background:#fff}
.vrow.on{border-color:var(--navy);background:var(--navy-soft)}
.vrow b{font-size:15px}
.vrow small{grid-column:1/3;color:var(--muted);font-size:12px}
.unit-hit{margin-top:6px;font-size:14px;color:var(--navy);font-weight:600;min-height:20px}
.unit-hit.bad{color:var(--warn)}
.ck-cat{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px;background:#fff}
.ck-cat.sel{border-color:var(--navy)}
.ck-cat.think{border-color:var(--accent);background:var(--accent-soft)}
.ck-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.ck-head h3{font-size:16px;margin-right:auto}
.tri{display:flex;gap:4px}
.tri .seg{padding:6px 12px;font-size:14px}
.tri .seg.t[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.memo{margin-top:8px;width:100%;border:1px solid var(--accent);border-radius:8px;padding:9px 10px;font-size:15px;background:#fff}
.queue{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.qrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.qrow .qn{width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-family:var(--f-num)}
.qrow small{display:block;color:var(--muted)}
.think-box{border:2px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.think-box h3{font-size:15px;color:var(--accent);margin-bottom:6px}
.think-box li{margin:3px 0}
.upsell{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.upsell h3{font-size:14px;margin-bottom:6px}
.upsell .u{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:4px 0}
.pop{font-size:12px;color:var(--ok);font-weight:600}
.badge-src{display:inline-flex;gap:6px;align-items:center;margin:0 0 12px;padding:6px 10px;border-radius:8px;background:var(--navy-soft);color:var(--navy);font-size:13px}
.badge-src.staff{background:var(--accent-soft);color:var(--accent)}
.funnel{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;margin-top:12px}
.fstep{flex:1 1 140px;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}
.fstep span{font-size:13px;color:var(--muted)} .fstep b{display:block;font-size:26px;color:var(--navy);font-family:var(--f-num)}
.fstep em{font-style:normal;font-size:12px;color:var(--muted)}
.farrow{align-self:center;color:var(--muted)}
/* 고객 휴대폰 화면 */
.guest-wrap{max-width:440px;margin:18px auto}
.phone{border:1px solid var(--line);border-radius:24px;background:#fff;padding:22px 18px;box-shadow:0 2px 12px rgba(30,40,60,.08)}
.phone h2{font-size:20px;color:var(--navy)}
.phone .field{margin-top:12px}

function schedule(price,catId,method){
  if(method==="lump"){const v=Math.floor(price*(100-S.lumpDiscount)/100/100)*100;return[{name:"일시납 ("+S.lumpDiscount+"% 할인)",due:"계약일",amt:v}];}
  const r=S.stages.map(s=>s.ratio);
  if(S.itemDeposit[catId]!=null){const diff=r[0]-S.itemDeposit[catId];r[0]=S.itemDeposit[catId];r[r.length-1]+=diff;}
  let acc=0;return S.stages.map((s,i)=>{let a;if(i===S.stages.length-1)a=price-acc;else{a=Math.floor(price*r[i]/100/S.roundUnit)*S.roundUnit;acc+=a;}return{name:s.name+" ("+r[i]+"%)",due:s.due,amt:a};});
}

/* ===== 구글시트 동기화 =====
 * render() 때마다 바뀐 기록을 찾아 시트로 보내고(push), 4초마다 다른 기기의 변경을 받아온다(pull).
 * 고객 QR 화면은 보내기만 하고 다른 사람 정보는 받아오지 않는다. */
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const SYNC={ack:{},pullP:null,hash:{},pending:{},last:0,resetAt:0,ok:null,at:0,busy:false,err:"",dirtyRender:false};
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
let API=lsGet("oc_api")||DEFAULT_API;
function syncRecs(){const o=[];
  VISITS.forEach(v=>o.push(["visits",v.id,v]));LEDGER.forEach(r=>o.push(["ledger",r.id,r]));HIST.forEach(h=>o.push(["hist",h.id,h]));
  Object.keys(ORIG).forEach(u=>o.push(["meta","ORIG:"+u,{k:"ORIG",u,v:ORIG[u]}]));Object.keys(OWNER).forEach(u=>o.push(["meta","OWNER:"+u,{k:"OWNER",u,v:OWNER[u]}]));return o;}
function syncSummary(c,d){if(c==="visits")return`${d.unit||"동호 미정"} ${d.name} · ${d.status}`;if(c==="ledger")return`${d.unit} ${d.item} · ${won(d.amount)} · ${d.status}`;if(c==="hist")return`${d.unit} ${d.kind} · ${(d.text||"").split("\n")[0]}`;return`${d.k} ${d.u}`;}
function scanDirty(){if(!API)return;syncRecs().forEach(([c,id,d])=>{const k=c+"|"+id,j=JSON.stringify(d);if(SYNC.hash[k]!==j){SYNC.hash[k]=j;SYNC.pending[k]={col:c,id,data:d,by:st.user||"고객",summary:syncSummary(c,d)};SYNC.ack[k]=Infinity;}});
  lsSet("oc_pending",JSON.stringify(SYNC.pending));}
async function syncPush(){if(!API||SYNC.busy)return;const keys=Object.keys(SYNC.pending);if(!keys.length)return;SYNC.busy=true;
  try{const rows=keys.map(k=>SYNC.pending[k]);const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({rows})}).then(x=>x.json());
    if(r.ok){const ackT=Date.now();keys.forEach(k=>{SYNC.ack[k]=ackT;});keys.forEach(k=>{if(SYNC.pending[k]&&JSON.stringify(SYNC.pending[k].data)===SYNC.hash[k])delete SYNC.pending[k];});lsSet("oc_pending",JSON.stringify(SYNC.pending));SYNC.ok=true;SYNC.at=Date.now();SYNC.err="";}
  }catch(e){SYNC.ok=false;SYNC.err="연결 끊김";}finally{SYNC.busy=false;syncBadge();}}
function syncApply(c,id,d){
  if(c==="visits"){const i=VISITS.findIndex(x=>x.id===id);if(i>=0)VISITS[i]=d;else VISITS.push(d);}
  else if(c==="ledger"){const i=LEDGER.findIndex(x=>x.id===id);if(i>=0)LEDGER[i]=d;else LEDGER.push(d);}
  else if(c==="hist"){const i=HIST.findIndex(x=>x.id===id);if(i>=0)HIST[i]=d;else HIST.push(d);}
  else if(c==="meta"){if(d.k==="ORIG")ORIG[d.u]=d.v;if(d.k==="OWNER")OWNER[d.u]=d.v;}}
function syncPull(){if(!API||st.guestOnly)return Promise.resolve();if(SYNC.pullP)return SYNC.pullP;
  SYNC.pullP=syncPullOnce().finally(()=>{SYNC.pullP=null;});return SYNC.pullP;}
/* v6.5: 버튼을 누르기 전에 출발한 가져오기 결과가 방금 바꾼 기록을 옛 값으로 덮지 않게 한다 */
async function syncPullOnce(){const t0=Date.now();let skipped=false;
  try{const r=await fetch(API+(API.includes("?")?"&":"?")+"since="+Math.max(0,SYNC.last-3000)).then(x=>x.json());if(!r.ok)throw 0;
    if(r.resetAt&&r.resetAt>SYNC.resetAt){if(SYNC.loaded){VISITS.length=0;LEDGER.length=0;HIST.length=0;Object.keys(ORIG).forEach(k=>delete ORIG[k]);Object.keys(OWNER).forEach(k=>delete OWNER[k]);SYNC.hash={};SYNC.pending={};SYNC.ack={};SYNC.dirtyRender=true;}SYNC.resetAt=r.resetAt;}
    let changed=false;
    r.rows.forEach(x=>{const k=x.col+"|"+x.id,j=JSON.stringify(x.data);if(SYNC.pending[k]){skipped=true;return;}if(SYNC.ack[k]!=null){if(t0<=SYNC.ack[k]){skipped=true;return;}if(t0-SYNC.ack[k]>60000)delete SYNC.ack[k];}if(SYNC.hash[k]===j)return;SYNC.hash[k]=j;syncApply(x.col,x.id,x.data);changed=true;});
    if(!skipped)SYNC.last=r.now;SYNC.loaded=true;SYNC.ok=true;SYNC.at=Date.now();SYNC.err="";
    if(changed||SYNC.dirtyRender)syncRender();
  }catch(e){SYNC.ok=false;SYNC.err="연결 끊김";}syncBadge();}
function syncRender(){const a=document.activeElement;if((a&&/INPUT|TEXTAREA|SELECT|IFRAME/.test(a.tagName)&&a.type!=="checkbox")||st.addrOpen){SYNC.dirtyRender=true;return;}SYNC.dirtyRender=false;render();}
function syncBadge(){const el=document.getElementById("syncBadge");if(!el)return;
  if(!API){el.textContent="오프라인 시안 (샘플)";el.className="sync off";return;}
  const n=Object.keys(SYNC.pending).length;
  if(SYNC.ok===false){el.textContent=`● 연결 끊김${n?` · 보낼 기록 ${n}건 보관 중`:""}`;el.className="sync bad";return;}
  const sec=SYNC.at?Math.round((Date.now()-SYNC.at)/1000):null;el.textContent=n?`● 저장 중 ${n}건`:`● 시트 연결됨${sec!=null?` · ${sec}초 전`:""}`;el.className="sync ok";}
function initSync(){
  if(!API)return;
  try{const p=JSON.parse(lsGet("oc_pending")||"{}");Object.assign(SYNC.pending,p);}catch(e){}
  if(!st.guestOnly){syncPull();setInterval(()=>{syncPull().then(syncPush);},4000);}
  setInterval(()=>{if(SYNC.dirtyRender)syncRender();syncBadge();},1500);
  document.addEventListener("focusout",()=>setTimeout(()=>{if(SYNC.dirtyRender)syncRender();},50));
}

/* ===== 현장 인기도: 같은 타입 확정 계약 세대 중 이 품목을 계약한 비율 ===== */
function popularity(catId,type){
  const live=LEDGER.filter(l=>l.status==="계약"&&l.type===type);const units=new Set(live.map(l=>l.unit));
  if(units.size<S.popMin)return null;const hit=new Set(live.filter(l=>l.cat===catId).map(l=>l.unit)).size;
  return{n:units.size,hit,pct:Math.round(hit/units.size*100)};
}

const DEMO_DAY=true;

const waitMin=v=>Math.max(0,Math.round((Date.now()-v.at)/60000));
const waitTxt=v=>{const m=waitMin(v);return m>180?"대기 중":m+"분 대기";};
function addrResults(){const q=(st.addrQ||"").trim();if(!q)return"";const res=ADDR_SAMPLE.filter(a=>(a.road+a.jibun).includes(q));
  return res.length?res.map(a=>`<button type="button" class="addr-res" data-addr="${ADDR_SAMPLE.indexOf(a)}">${esc(a.road)}<small>지번 ${esc(a.jibun)} · 우편번호 ${a.zip}</small></button>`).join(""):'<p class="note">검색 결과가 없습니다. 시안에는 샘플 주소 5개만 있습니다(숭의, 봉담, 송도로, 송파).</p>';}

const POSTCODE_JS="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js";
let postcodeState=window.daum&&window.daum.Postcode?"ok":"";
function loadPostcode(cb){if(postcodeState==="ok"){cb();return;}if(postcodeState==="fail"){cb();return;}
  if(postcodeState!=="loading"){postcodeState="loading";const sc=document.createElement("script");sc.src=POSTCODE_JS;
    sc.onload=()=>{postcodeState=window.daum&&window.daum.Postcode?"ok":"fail";(loadPostcode.q||[]).forEach(f=>f());loadPostcode.q=[];};
    sc.onerror=()=>{postcodeState="fail";(loadPostcode.q||[]).forEach(f=>f());loadPostcode.q=[];};document.head.appendChild(sc);
    setTimeout(()=>{if(postcodeState==="loading"){postcodeState="fail";(loadPostcode.q||[]).forEach(f=>f());loadPostcode.q=[];}},8000);}
  (loadPostcode.q=loadPostcode.q||[]).push(cb);}
function addrBox(){
  if(postcodeState==="fail")return`<div class="addr-box"><p class="note" style="margin:0 0 6px">주소 검색 서비스에 연결되지 않아 샘플 주소로 찾습니다. 인터넷 연결을 확인하세요.</p><input id="addrQ" class="memo" style="border-color:var(--line)" value="${esc(st.addrQ)}" placeholder="도로명, 건물명, 지번 (예: 숭의)"><div id="addrRes">${addrResults()}</div></div>`;
  return`<div class="addr-box"><div class="row" style="justify-content:space-between;align-items:center;margin-bottom:6px"><small style="color:var(--muted)">도로명·건물명·지번으로 검색하고 결과를 누르세요</small><button type="button" class="seg" id="addrClose">닫기</button></div><div id="postcodeWrap" style="height:440px;border:1px solid var(--line);border-radius:8px;overflow:hidden">${postcodeState==="ok"?"":'<p class="note" style="padding:12px">주소 검색을 불러오는 중…</p>'}</div></div>`;}
function bindAddr(target){
  const cl=$("#addrClose");if(cl)cl.onclick=()=>{st.addrOpen=false;render();};
  const pw=$("#postcodeWrap");
  if(pw){if(postcodeState!=="ok"){loadPostcode(()=>{if(st.addrOpen)render();});}
    else{new daum.Postcode({width:"100%",height:"100%",animation:false,
      oncomplete:d=>{target.addr=d.roadAddress||d.jibunAddress||d.address;target.zip=d.zonecode;if(d.buildingName&&target.addr.indexOf(d.buildingName)<0)target.addr+=" ("+d.buildingName+")";st.addrOpen=false;st.addrQ="";render();
        const det=$("#g-addrDetail")||$("[data-cf='addrDetail']");if(det)det.focus();}}).embed(pw,{autoClose:false});}}
  const aq=$("#addrQ");if(aq){const upd=()=>{st.addrQ=aq.value;$("#addrRes").innerHTML=addrResults();bindAddrRes(target);};let comp=false;
    aq.addEventListener("compositionstart",()=>comp=true);aq.addEventListener("compositionend",()=>{comp=false;upd();});aq.addEventListener("input",()=>{if(!comp)upd();});}
  bindAddrRes(target);
}
function bindAddrRes(target){$$("[data-addr]").forEach(b=>b.onclick=()=>{const a=ADDR_SAMPLE[+b.dataset.addr];target.addr=a.road;target.zip=a.zip;st.addrOpen=false;st.addrQ="";render();});}

    st.g={unit:"",unknown:false,name:"",phone:"",addr:"",zip:"",addrDetail:"",c1:false,c2:false,mode:g.mode,paperNo:""};
    if(phone){st.gdone=true;}else toast("방명록에 등록했습니다.");render();};

/* ===== 관리대장 (v5): 처리할 일 → 검색 → 세대 카드 → 처리 → 업체 통보 ===== */
const DAY=864e5;
const todayMs=()=>Date.parse(today());
const dueLeft=r=>Math.ceil((Date.parse(r.date)+14*DAY-todayMs())/DAY);
const md=d=>{const x=new Date(d);return`${x.getMonth()+1}/${x.getDate()}`;};
const visitOf=u=>VISITS.filter(v=>v.unit===u).sort((a,b)=>(b.status==="계약")-(a.status==="계약"))[0];
const canEdit=()=>st.role==="관리";
Object.assign(st,{lv:"unit",lq:"",lf:null,lunit:null,lact:null,lco:"WV",hUn:false,lform:{}});

function unitRows(){
  const m={};LEDGER.forEach(r=>{(m[r.unit]=m[r.unit]||[]).push(r);});
  return Object.entries(m).map(([u,rows])=>{const live=rows.filter(r=>r.status!=="취소");const v=visitOf(u);
    const owner=OWNER[u]||{};
    return{u,type:rows[0].type,rows,live,name:owner.name||(live[0]||rows[0]).name,phone:owner.phone||(v?v.phone:""),total:live.reduce((t,r)=>t+r.amount,0),
      wait:live.some(r=>r.pay==="이체 · 확인 대기"),orig:ORIG[u]===false,due:live.some(r=>{const d=dueLeft(r);return d>=0&&d<=3;}),un:HIST.some(h=>h.unit===u&&!h.notified)};})
   .sort((a,b)=>unitCode(a.u).localeCompare(unitCode(b.u)));
}
function todo(){const us=unitRows();return{wait:us.filter(x=>x.wait).length,orig:us.filter(x=>x.orig).length,un:HIST.filter(h=>!h.notified).length,due:us.filter(x=>x.due).length};}
function matchQ(x,q){q=q.trim();if(!q)return true;const d=q.replace(/\D/g,"");
  return (d.length>=3&&unitCode(x.u).includes(d))||(d.length===4&&String(x.phone).endsWith(d))||x.name.includes(q)||x.rows.some(r=>r.name.includes(q));}
function filtered(){const f=st.lf;return unitRows().filter(x=>matchQ(x,st.lq)&&(!f||(f==="wait"&&x.wait)||(f==="orig"&&x.orig)||(f==="due"&&x.due)||(f==="un"&&x.un)));}

   <h3 style="font-size:14px;color:var(--muted);margin:12px 0 6px">처리할 일 — 모두 0이면 오늘 일은 끝입니다</h3>
   <div class="todos">${tile("wait","이체 확인 대기",t.wait,"업체 확인 후 처리")}${tile("orig","원본 미수거",t.orig,"보관용 계약서")}${tile("un","업체 미통보",t.un,"처리 후 통보 안 함")}${tile("due","철회 기한 3일 이내",t.due,"계약일 + 14일")}</div>

    <div class="row" style="gap:6px" role="group" aria-label="보기">${[["unit","세대별"],["co","품목사별"],["hist","변경 이력"]].map(([k,l])=>`<button class="seg" data-lv="${k}" aria-pressed="${st.lv===k}" style="padding:8px 14px">${l}</button>`).join("")}</div></div>
  </section>

   <section class="panel">${cur?unitCard(cur):'<h2>세대 카드</h2><p class="hint">왼쪽에서 세대를 고르거나 검색하세요. 고객 전화가 오면 동·호수부터 칩니다.</p>'}</section></div>`;

     <td>${r.pay==="이체 · 확인 대기"?`<button class="seg" data-lcf="${r.id}"><span class="pill w">이체 확인 대기</span></button>`:`<small>${esc(r.pay)}</small>`}</td>
     <td><small>${md(r.date)} · ${esc(r.staff||"-")}</small><br>${live?(d>=0?`<span class="chip ${d<=3?"":"gray"}">철회 D-${d}</span>`:'<span class="chip gray">철회 기한 지남</span>'):'<span class="chip warn">취소</span>'}</td>

   <div class="tblwrap" style="margin-top:12px"><table class="lt"><tr><th>품목</th><th>품목사</th><th class="r">금액</th><th>결제</th><th>계약·철회</th><th></th></tr>${rowsHtml}</table></div>
   <div class="row" style="margin-top:12px;gap:8px;align-items:center">
    ${ORIG[x.u]===false?`<span class="photo"><label class="cam" for="op-${x.u}">원본 수거 + 촬영</label><input id="op-${x.u}" type="file" accept="image/*" capture="environment" data-op="${x.u}"></span><button class="seg" data-orig="${x.u}" style="padding:8px 12px">사진 없이 수거 처리</button>`

function addHist(unit,kind,text,cos,extra={}){
  const x=unitRows().find(z=>z.u===unit);
  const msg=`[${kind} 통보] ${unitLabel(unit)} ${x?x.name:""}\n${text}${extra.judge?"\n판정: "+extra.judge:""}\n해당 업체: ${cos.map(c=>COMPANIES[c].short).join(", ")}\n처리: ${st.user} (${md(Date.now())} ${hhmm(Date.now())})`;
  HIST.push({id:uid("H"),at:Date.now(),by:st.user,unit,kind,text,judge:extra.judge||"",cos,msg,notified:false});
}

  $$("[data-lf]").forEach(b=>b.onclick=()=>{st.lf=st.lf===b.dataset.lf?null:b.dataset.lf;st.lv=st.lf==="un"?"hist":"unit";st.hUn=st.lf==="un";render();});

  const f=st.lform;const x=unitRows().find(z=>z.u===st.lunit);

  $$("[data-nopt]").forEach(c=>c.onchange=()=>{f.opt=c.dataset.nopt;render();});$$("[data-aopt]").forEach(c=>c.onchange=()=>{f.opt=c.dataset.aopt;render();});
  $$("[data-nm]").forEach(b=>b.onclick=()=>{f.method=b.dataset.nm;render();});
  [["f-name","name"],["f-phone","phone"],["f-addr","addr"]].forEach(([id,k])=>{const el=$("#"+id);if(el)el.oninput=()=>f[k]=el.value;});
  const ok=$("#f-ok");if(!ok||!x)return;
  ok.onclick=()=>{const a=st.lact;
    if(a==="cancel"){const sel=x.live.filter(r=>f.ids&&f.ids[r.id]);sel.forEach(r=>r.status="취소");
      const inT=sel.every(r=>dueLeft(r)>=0),outT=sel.every(r=>dueLeft(r)<0);

      toast(a==="owner"?"명의를 변경했습니다 (시안: 승계 확인서 출력 생략).":"변경했습니다.");}
    st.lact=null;st.lform={};render();};

  $$("[data-stn]").forEach(i=>i.onchange=e=>S.staff[+i.dataset.stn].name=e.target.value.trim());$$("[data-str]").forEach(i=>i.onchange=e=>S.staff[+i.dataset.str].role=e.target.value);
  $$("[data-stp]").forEach(i=>i.onchange=e=>{const v=e.target.value.replace(/\D/g,"");if(v.length!==4)toast("PIN은 숫자 4자리입니다.");else S.staff[+i.dataset.stp].pin=v;});
  $$("[data-stx]").forEach(b=>b.onclick=()=>{S.staff.splice(+b.dataset.stx,1);render();});$("#addStaff").onclick=()=>{S.staff.push({name:"새 직원",pin:"9999",role:"계약"});render();};
  $$("[data-ex]").forEach(i=>i.onchange=e=>{const v=e.target.value;if(v==="")delete S.itemDeposit[i.dataset.ex];else S.itemDeposit[i.dataset.ex]=+v;});
}
if(new URLSearchParams(location.search).has("guest")){st.guestMode=true;st.guestOnly=true;}
if(!API)seedSample();
initSync();
render();
</script>

<script>
/* 새 버전 알림: 3분마다 서버의 최신 파일을 확인해서 버전이 바뀌었으면 위에 안내를 띄운다 */
(function(){const cur=(document.querySelector('.sample')||{}).textContent||"";const ver=(cur.match(/v[0-9.]+/)||[""])[0];
function chk(){fetch(location.pathname+"?nc="+Date.now(),{cache:"no-store"}).then(r=>r.text()).then(t=>{const m=t.match(/검토용 시안 (v[0-9.]+)/);
 if(m&&ver&&m[1]!==ver&&!document.getElementById("newVer")){const d=document.createElement("div");d.id="newVer";
  d.style.cssText="position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:9999;background:#2c4a8a;color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.2);font-size:14px;display:flex;gap:10px;align-items:center";
  d.innerHTML="새 버전("+m[1]+")이 올라왔습니다 <button style='background:#fff;color:#2c4a8a;border:0;border-radius:6px;padding:6px 10px;font-weight:700'>새로고침</button>";
  d.querySelector("button").onclick=()=>{const q=location.search.replace(/[?&]nc=\d+/g,"").replace(/^&/,"?");location.replace(location.pathname+q+(q?"&":"?")+"nc="+Date.now());};document.body.appendChild(d);}}).catch(()=>{});}
setTimeout(chk,5000);setInterval(chk,180000);})();
</script>
